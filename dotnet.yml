name: RaceDay Build and Test
on:
  push:
    branches: [ "main", "master", "part2", "part3" ]
  pull_request:
    branches: [ "main", "master", "part2", "part3" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore RaceDay.sln
      - name: Build API, MVC and tests
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
